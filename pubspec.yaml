name: ecoruta
description: Aplicación móvil EcoRuta para descubrir destinos turísticos de Nicaragua.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_map: ^8.3.2
  geolocator: ^14.0.3
  http: ^1.6.0
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png
    - assets/branding/splash_logo.png
