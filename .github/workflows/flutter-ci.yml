name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar plataforma Android si no existe
        run: flutter create --platforms=android --org com.ecoruta .

      - name: Configurar permisos Android
        run: python3 tool/configure_android.py

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK de prueba
        run: flutter build apk --debug

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EcoRuta-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
